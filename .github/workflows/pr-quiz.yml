# Comprehension quiz gate for PRs into shahab.
#
# 1. The pr-review-loop skill posts a summary + quiz comment containing an encrypted answer key (see .github/pr-quiz/README.md).
# 2. A reviewer answers with a comment such as "/quiz B C A".
# Either comment runs "quiz.sh sync": it renders the HTML summary (run artifact + job summary), grades every answer that has
# not been graded yet and sets the pr-quiz check on the PR head: pending, passed (score >= 90%) or failed (3 attempts used).
# Sync is idempotent and works from the comment history, so a run that is cancelled by the concurrency group or re-run
# loses or repeats nothing.
#
# issue_comment workflows always run from the default branch, so PR code (or an AI agent working on it) cannot change how it is
# graded, and the private key lives in the "pr-quiz" environment, which only the shahab branch can use.
name: pr-quiz

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  sync:
    if: >-
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '<!-- pr-quiz:v1 ') || startsWith(github.event.comment.body, '/quiz')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pr-quiz
    permissions:
      checks: write
      issues: write
      pull-requests: write
    concurrency:
      group: pr-quiz-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/pr-quiz
          persist-credentials: false

      - id: quiz
        run: mkdir -p out && .github/pr-quiz/quiz.sh sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUT_DIR: out
          PR_QUIZ_PRIVATE_KEY: ${{ secrets.PR_QUIZ_PRIVATE_KEY }}

      - if: always() && steps.quiz.outputs.html
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.quiz.outputs.html }}
          archive: false
          overwrite: true
          retention-days: 30
